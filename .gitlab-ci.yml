image: node:24.19.0

stages:
  - verify
  - publish

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

verify:
  stage: verify
  script:
    - npm ci
    - npm run build
    - npm run test:unit -- --run
    - npm pack --dry-run

publish:
  stage: publish
  needs: [verify]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
  script:
    - npm ci
    - |
      node -e 'const version = require("./package.json").version;
      const tag = process.env.CI_COMMIT_TAG;
      if ("v" + version !== tag) {
        console.error("Tag " + tag + " must match package version v" + version + ".");
        process.exit(1);
      }'
    - npm publish --//registry.npmjs.org/:_authToken="$NPM_TOKEN" --registry=https://registry.npmjs.org/
