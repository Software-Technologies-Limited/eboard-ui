name: Verify and publish package

on:
  push:
    branches:
      - main

concurrency:
  group: package-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci
      - run: npm run build
      - run: npm run test:unit -- --run
      - run: npm pack --dry-run

  publish:
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci

      - name: Calculate next patch version
        id: version
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const { appendFileSync } = require("node:fs");
            const local = require("./package.json").version;
            let published = "0.0.0";

            try {
              published = execSync("npm view @stl-eboard/ui version", {
                encoding: "utf8",
              }).trim();
            } catch {
              console.log("No existing npm release found; using the local version as the baseline.");
            }

            const parts = (version) => version.split("-")[0].split(".").map(Number);
            const compare = (left, right) => {
              const a = parts(left);
              const b = parts(right);
              return a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            };
            const baseline = compare(local, published) >= 0 ? local : published;
            const [major, minor, patch] = parts(baseline);
            const next = `${major}.${minor}.${patch + 1}`;

            console.log(`Local: ${local}; npm: ${published}; releasing: ${next}`);
            appendFileSync(process.env.GITHUB_OUTPUT, `value=${next}\n`);
          '

      - name: Set package version
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version

      - name: Publish package
        run: npm publish --registry=https://registry.npmjs.org/

      - name: Record release in GitHub
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push origin HEAD:main "v${VERSION}"
